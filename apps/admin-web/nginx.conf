server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Headers de seguridad básicos
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Proxy hacia la API interna de Docker
    location ^~ /api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRÍTICO: pasar el Origin del navegador sin modificar.
        # WebOriginValidationFilter valida Origin == WEB_ALLOWED_ORIGIN.
        proxy_set_header Origin $http_origin;

        # Permitir que la cookie HttpOnly rt_web fluya al navegador
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA Angular — fallback a index.html para todas las rutas del router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Endpoint de healthcheck interno de Nginx
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
