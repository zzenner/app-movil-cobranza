spring:
  application:
    name: cobranza-api

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false

  mvc:
    problemdetails:
      enabled: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  security:
    oauth2:
      resourceserver:
        jwt:
          # JwtDecoder se configura programáticamente en SecurityConfig.
          # Estas propiedades no se usan directamente.

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  info:
    env:
      enabled: false

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
  show-actuator: false

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

security:
  bcrypt:
    strength: 12

app:
  jwt:
    duracion-access-token: PT15M
    duracion-refresh-token: P30D
    duracion-sesion-absoluta: P90D
    max-intentos-fallidos: 5
    duracion-bloqueo-temporal: PT30M
    issuer: ${JWT_ISSUER:cobranza-api-dev}
    audience: ${JWT_AUDIENCE:cobranza-api}
    kid: ${JWT_KID:cobranza-rsa-2026-01}
    rsa:
      clave-privada: ${JWT_RSA_PRIVADA_PATH:}
      clave-publica: ${JWT_RSA_PUBLICA_PATH:}
