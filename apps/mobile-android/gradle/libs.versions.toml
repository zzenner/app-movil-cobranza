[versions]
agp                  = "9.3.0"
kotlin               = "2.4.10"
ksp                  = "2.3.10"
composeBom           = "2026.06.01"
activityCompose      = "1.9.3"
lifecycle            = "2.9.0"
hilt                 = "2.60.1"
hiltAndroidx         = "1.4.0"
navigationCompose    = "2.9.8"
datastore            = "1.2.1"
retrofit             = "3.0.0"
okhttpBom            = "5.4.0"
kotlinxSerialization = "1.11.0"
kotlinxCoroutines    = "1.11.0"
mockk                = "1.13.12"
turbine              = "1.2.0"
junit                = "4.13.2"
room                 = "2.7.2"
workmanager          = "2.10.1"
robolectric          = "4.14.1"
androidxTestCore     = "1.6.1"
androidxTestExtJunit = "1.2.1"

[libraries]
# Compose (versioned via BOM)
compose-bom               = { group = "androidx.compose",          name = "compose-bom",             version.ref = "composeBom" }
compose-ui                = { group = "androidx.compose.ui",        name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui",       name = "ui-tooling-preview" }
compose-ui-tooling        = { group = "androidx.compose.ui",        name = "ui-tooling" }
compose-material3         = { group = "androidx.compose.material3", name = "material3" }
compose-material-icons-extended = { group = "androidx.compose.material", name = "material-icons-extended" }

# AndroidX
activity-compose          = { group = "androidx.activity",   name = "activity-compose",         version.ref = "activityCompose" }
lifecycle-runtime-ktx     = { group = "androidx.lifecycle",  name = "lifecycle-runtime-ktx",    version.ref = "lifecycle" }
lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }

# Navigation
navigation-compose        = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }

# Hilt
hilt-android              = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-android-compiler     = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }
hilt-navigation-compose   = { group = "androidx.hilt",     name = "hilt-navigation-compose", version.ref = "hiltAndroidx" }
hilt-android-testing      = { group = "com.google.dagger", name = "hilt-android-testing",  version.ref = "hilt" }
hilt-android-testing-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# DataStore
datastore-preferences     = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }

# Network — Retrofit 3
retrofit                  = { group = "com.squareup.retrofit2", name = "retrofit",                           version.ref = "retrofit" }
retrofit-converter-kotlinx = { group = "com.squareup.retrofit2", name = "converter-kotlinx-serialization",   version.ref = "retrofit" }

# Network — OkHttp 5 (pinned via BOM)
okhttp-bom                = { group = "com.squareup.okhttp3", name = "okhttp-bom",          version.ref = "okhttpBom" }
okhttp                    = { group = "com.squareup.okhttp3", name = "okhttp" }
okhttp-logging            = { group = "com.squareup.okhttp3", name = "logging-interceptor" }
okhttp-mockwebserver      = { group = "com.squareup.okhttp3", name = "mockwebserver" }

# Kotlinx
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json",   version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android",  version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",     version.ref = "kotlinxCoroutines" }

# Room
room-runtime              = { group = "androidx.room",  name = "room-runtime",  version.ref = "room" }
room-ktx                  = { group = "androidx.room",  name = "room-ktx",      version.ref = "room" }
room-compiler             = { group = "androidx.room",  name = "room-compiler", version.ref = "room" }
room-testing              = { group = "androidx.room",  name = "room-testing",  version.ref = "room" }

# WorkManager
workmanager-ktx           = { group = "androidx.work",  name = "work-runtime-ktx", version.ref = "workmanager" }
workmanager-testing       = { group = "androidx.work",  name = "work-testing",     version.ref = "workmanager" }

# Hilt WorkManager bridge
hilt-work                 = { group = "androidx.hilt",  name = "hilt-work",     version.ref = "hiltAndroidx" }
hilt-compiler-androidx    = { group = "androidx.hilt",  name = "hilt-compiler", version.ref = "hiltAndroidx" }

# Testing
junit                     = { group = "junit",           name = "junit",      version.ref = "junit" }
mockk                     = { group = "io.mockk",        name = "mockk",      version.ref = "mockk" }
turbine                   = { group = "app.cash.turbine", name = "turbine",   version.ref = "turbine" }
robolectric               = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
androidx-test-core        = { group = "androidx.test",  name = "core",        version.ref = "androidxTestCore" }
androidx-test-ext-junit   = { group = "androidx.test.ext", name = "junit",     version.ref = "androidxTestExtJunit" }

[plugins]
android-application   = { id = "com.android.application",                    version.ref = "agp" }
android-library       = { id = "com.android.library",                         version.ref = "agp" }
kotlin-android        = { id = "org.jetbrains.kotlin.android",                version.ref = "kotlin" }
kotlin-compose        = { id = "org.jetbrains.kotlin.plugin.compose",         version.ref = "kotlin" }
kotlin-serialization  = { id = "org.jetbrains.kotlin.plugin.serialization",   version.ref = "kotlin" }
hilt                  = { id = "com.google.dagger.hilt.android",              version.ref = "hilt" }
ksp                   = { id = "com.google.devtools.ksp",                      version.ref = "ksp" }
