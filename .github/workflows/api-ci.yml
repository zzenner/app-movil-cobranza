name: API CI

on:
  push:
    branches: ["**"]
    paths:
      - "apps/api/**"
      - "contracts/openapi/**"
      - ".github/workflows/api-ci.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "apps/api/**"
      - "contracts/openapi/**"
      - ".github/workflows/api-ci.yml"

jobs:
  build:
    name: Compilar y verificar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
          cache-dependency-path: apps/api/pom.xml

      - name: Compilar y ejecutar pruebas
        working-directory: apps/api
        run: ./mvnw -B verify
