name: Android CI

on:
  push:
    branches: [ main, 'feature/**' ]
    paths:
      - 'apps/mobile-android/**'
      - '.github/workflows/android-ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'apps/mobile-android/**'

jobs:
  build-and-test:
    name: Build, Lint, JVM Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: 'platforms;android-37.1 build-tools;37.0.0'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile-android/**/*.gradle.kts', 'apps/mobile-android/gradle/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x apps/mobile-android/gradlew

      - name: Compile debug
        working-directory: apps/mobile-android
        run: ./gradlew assembleDebug --no-daemon

      - name: Lint
        working-directory: apps/mobile-android
        run: ./gradlew lint --no-daemon

      - name: JVM unit tests
        working-directory: apps/mobile-android
        run: ./gradlew test --no-daemon

      # Pruebas instrumentadas: requieren emulador. Documentadas pero no activas en CI.
      # Para ejecutar localmente con dispositivo conectado:
      #   ./gradlew connectedAndroidTest --no-daemon
      #
      # Para activar en CI, agregar un paso con:
      #   uses: reactivecircus/android-emulator-runner@v2
      #   with:
      #     api-level: 29
      #     script: ./gradlew connectedAndroidTest --no-daemon
