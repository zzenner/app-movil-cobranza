          description: No autenticado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Sin permiso PERM_ASIGNACIONES_VER.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/admin/asignaciones/diarias:
    get:
      tags:
        - Admin — Asignaciones
      summary: Listar asignaciones diarias
      description: |
        Lista asignaciones diarias con filtros opcionales. Máximo 200 resultados, ordenados por fecha DESC.
        **Permiso requerido:** `PERM_ASIGNACIONES_VER`.
      security:
        - bearerAuth: []
      parameters:
        - name: fecha
          in: query
          required: false
          schema:
            type: string
            format: date
          example: "2026-08-13"
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [BORRADOR, PUBLICADA, FINALIZADA, CANCELADA]
        - name: carteraId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: supervisorId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: ejecutivoId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Lista de asignaciones diarias.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ItemAsignacionDiariaAdmin'
        "401":
          description: No autenticado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Sin permiso PERM_ASIGNACIONES_VER.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    post:
      tags:
        - Admin — Asignaciones
      summary: Crear asignación diaria en borrador
      description: |
        Crea una nueva asignación diaria en estado `BORRADOR` para un ejecutivo y fecha dados.
        El `supervisorId` se extrae del `sub` del JWT.
        Las personas en `personaIds` deben pertenecer a la asignación mensual indicada.
        Retorna 201 con header `Location` y el ID de la nueva asignación.
        **Permiso requerido:** `PERM_ASIGNACIONES_ADMINISTRAR`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCrearBorradorAdmin'
      responses:
        "201":
          description: Asignación diaria creada en estado BORRADOR.
          headers:
            Location:
              schema:
                type: string
                format: uri
              description: URI del recurso creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCreacionAsignacion'
        "400":
          description: Datos inválidos (campos obligatorios faltantes).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "401":
          description: No autenticado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Sin permiso PERM_ASIGNACIONES_ADMINISTRAR.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "409":
          description: Una o más personas ya están en otra asignación diaria activa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                status: 409
                code: "PERSONA_YA_EN_ASIGNACION"
        "422":
          description: Una o más personas no pertenecen a la asignación mensual indicada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                status: 422
                code: "PERSONA_FUERA_DE_MENSUAL"

  /api/v1/admin/asignaciones/diarias/{id}:
    get:
      tags:
        - Admin — Asignaciones
      summary: Detalle de asignación diaria
      description: |
        Retorna el detalle completo de una asignación diaria incluyendo la lista de personas asignadas.
        **Permiso requerido:** `PERM_ASIGNACIONES_VER`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalle de la asignación diaria.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalleAsignacionDiariaAdmin'
        "401":
          description: No autenticado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Sin permiso PERM_ASIGNACIONES_VER.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Asignación diaria no encontrada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                status: 404
                code: "ASIGNACION_NO_ENCONTRADA"

  /api/v1/admin/asignaciones/diarias/{id}/personas:
    put:
      tags:
        - Admin — Asignaciones
      summary: Actualizar personas de un borrador
      description: |
        Reemplaza completamente la lista de personas de una asignación diaria en estado `BORRADOR`.
        Si `personaIds` está vacío, la asignación queda sin personas asignadas.
        **Permiso requerido:** `PERM_ASIGNACIONES_ADMINISTRAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudActualizarPersonasAdmin'
      responses:
        "204":
          description: Personas actualizadas correctamente.
        "400":
          description: Datos inválidos.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "401":
          description: No autenticado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Sin permiso PERM_ASIGNACIONES_ADMINISTRAR.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Asignación diaria no encontrada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "409":
          description: La asignación no está en estado BORRADOR, o persona ya en otra asignación activa.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "422":
          description: Una o más personas no pertenecen a la asignación mensual.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/admin/asignaciones/diarias/{id}/publicar:
    post:
      tags:
        - Admin — Asignaciones
      summary: Publicar asignación diaria
      description: |
        Transiciona la asignación de `BORRADOR` a `PUBLICADA`.
        El `publicadoPorId` se extrae del `sub` del JWT.
        A partir de este momento el ejecutivo puede descargar la asignación desde Android.
        **Permiso requerido:** `PERM_ASIGNACIONES_ADMINISTRAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
