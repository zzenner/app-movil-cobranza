  # ═══════════════════════════════════════════════════════════════════════════
  # Admin — Importaciones mensuales (Fase 5D — contrato CSV v2)
  # Ruta base: /api/v1/admin/importaciones/mensuales
  # Permiso requerido: PERM_DATOS_IMPORTAR
  # ═══════════════════════════════════════════════════════════════════════════

  /api/v1/admin/importaciones/mensuales:
    post:
      tags:
        - Admin — Importaciones
      summary: Subir archivo CSV de importación mensual
      description: |
        Recibe un archivo CSV con el contrato v2 (26 columnas, UTF-8, YYYY-MM-DD).
        El período y la cartera se obtienen de cada fila del CSV, no del request.
        El archivo se valida de forma asíncrona; el estado pasa a VALIDANDO.

        **Idempotencia:** si se sube el mismo archivo (mismo hash SHA-256 + sistemaOrigen),
        retorna HTTP 409 con el ID de la importación existente.

        **Permiso requerido:** `PERM_DATOS_IMPORTAR`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - archivo
              properties:
                sistemaOrigen:
                  type: string
                  default: LEGADO
                  description: Código del sistema de origen. Default LEGADO.
                  example: "LEGADO"
                archivo:
                  type: string
                  format: binary
                  description: Archivo CSV con el contrato v2 (26 columnas, UTF-8, YYYY-MM-DD).
      responses:
        "202":
          description: Archivo recibido. Validación asíncrona iniciada.
          headers:
            Location:
              description: URL del recurso creado (detalle de la importación).
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaCrearImportacion'
        "400":
          description: Archivo vacío, extensión no válida o encoding no UTF-8.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "401":
          description: No autenticado.
        "403":
          description: Sin permiso PERM_DATOS_IMPORTAR.
        "409":
          description: |
            ARCHIVO_YA_IMPORTADO — el mismo archivo ya fue importado (mismo hash SHA-256).
            O IMPORTACION_EN_PROGRESO — ya existe una importación en estado RECIBIDA/VALIDANDO/PROCESANDO.
          content:
            application/problem+json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ProblemDetail'
                  - type: object
                    properties:
                      importacionId:
                        type: string
                        format: uuid
                        description: ID de la importación ya existente (solo en ARCHIVO_YA_IMPORTADO).
        "422":
          description: PERIODO_ANTERIOR_NO_PERMITIDO — el período del CSV es anterior al último completado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

    get:
      tags:
        - Admin — Importaciones
      summary: Listar importaciones mensuales
      description: |
        Devuelve el historial paginado de importaciones, opcionalmente filtrado por cartera.
        **Permiso requerido:** `PERM_DATOS_IMPORTAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: carteraId
          in: query
          required: false
          schema:
            type: string
            format: uuid
          description: Filtrar por ID de cartera (opcional).
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamanio
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Listado paginado de importaciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPaginaImportaciones'
        "401":
          description: No autenticado.
        "403":
          description: Sin permiso PERM_DATOS_IMPORTAR.

  /api/v1/admin/importaciones/mensuales/{id}:
    get:
      tags:
        - Admin — Importaciones
      summary: Obtener detalle de una importación
      description: |
        Devuelve el estado actual y los contadores de una importación específica.
        **Permiso requerido:** `PERM_DATOS_IMPORTAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Detalle de la importación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportacionDetalle'
        "401":
          description: No autenticado.
        "403":
          description: Sin permiso PERM_DATOS_IMPORTAR.
        "404":
          description: Importación no encontrada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/admin/importaciones/mensuales/{id}/errores:
    get:
      tags:
        - Admin — Importaciones
      summary: Listar errores de validación de una importación
      description: |
        Devuelve los errores detectados durante la validación intra-archivo.
        Disponible cuando el estado es CON_ERRORES o VALIDADA (con advertencias).
        **Permiso requerido:** `PERM_DATOS_IMPORTAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: pagina
          in: query
          required: false
          schema:
            type: integer
            default: 0
        - name: tamanio
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Listado paginado de errores de validación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaPaginaErrores'
        "401":
          description: No autenticado.
        "403":
          description: Sin permiso PERM_DATOS_IMPORTAR.
        "404":
          description: Importación no encontrada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/admin/importaciones/mensuales/{id}/confirmar:
    post:
      tags:
        - Admin — Importaciones
      summary: Confirmar importación validada
      description: |
        Confirma una importación en estado VALIDADA para iniciar el procesamiento.
        El estado pasa a PROCESANDO de forma asíncrona.
        **Permiso requerido:** `PERM_DATOS_IMPORTAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: Procesamiento iniciado.
        "401":
          description: No autenticado.
        "403":
          description: Sin permiso PERM_DATOS_IMPORTAR.
        "404":
          description: Importación no encontrada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "409":
          description: ESTADO_INVALIDO_PARA_CONFIRMAR — la importación no está en estado VALIDADA.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  # ═══════════════════════════════════════════════════════════════════════════
  # Admin — Asignaciones diarias (Fase 6B)
  # Ruta base: /api/v1/admin/asignaciones
  # PERM_ASIGNACIONES_VER — lectura
  # PERM_ASIGNACIONES_ADMINISTRAR — escritura
  # ═══════════════════════════════════════════════════════════════════════════

  /api/v1/admin/asignaciones/periodos:
