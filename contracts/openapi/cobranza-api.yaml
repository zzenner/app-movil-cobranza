      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Usuario activado.
        "401":
          description: No autenticado.
        "403":
          description: Sin permiso USUARIOS_ADMINISTRAR.
        "404":
          description: Usuario no encontrado.

  /api/v1/admin/usuarios/{id}/desactivar:
    post:
      tags:
        - Admin — Usuarios
      summary: Desactivar usuario
      description: |
        Marca el usuario como inactivo y revoca sus sesiones activas.
        No puede ejecutarse sobre la propia cuenta del administrador (409 OPERACION_NO_PERMITIDA_PROPIA_CUENTA).
        No puede ejecutarse si el usuario es el último administrador activo (409 ULTIMO_ADMINISTRADOR).
        **Permiso requerido:** `USUARIOS_ADMINISTRAR`.
      security:
        - bearerAuth: []
      parameters:
