            format: uuid
      responses:
        "204":
          description: Asignación publicada correctamente.
        "401":
          description: No autenticado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Sin permiso PERM_ASIGNACIONES_ADMINISTRAR.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Asignación diaria no encontrada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "409":
          description: La asignación no está en estado BORRADOR (transición inválida).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                status: 409
                code: "TRANSICION_ESTADO_INVALIDA"

  /api/v1/admin/asignaciones/diarias/{id}/cancelar:
    post:
      tags:
        - Admin — Asignaciones
      summary: Cancelar asignación diaria
      description: |
        Cancela una asignación diaria en estado `BORRADOR` o `PUBLICADA`, pasándola a `CANCELADA`.
        Requiere un motivo de 1 a 500 caracteres.
        **Permiso requerido:** `PERM_ASIGNACIONES_ADMINISTRAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudCancelarAdmin'
      responses:
        "204":
          description: Asignación cancelada correctamente.
        "400":
          description: Motivo inválido (vacío o superior a 500 caracteres).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "401":
          description: No autenticado.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "403":
          description: Sin permiso PERM_ASIGNACIONES_ADMINISTRAR.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "404":
          description: Asignación diaria no encontrada.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        "409":
          description: La asignación no está en estado BORRADOR o PUBLICADA (transición inválida).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
              example:
                status: 409
                code: "TRANSICION_ESTADO_INVALIDA"
