      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Usuario desbloqueado.
        "401":
          description: No autenticado.
        "403":
          description: Sin permiso USUARIOS_ADMINISTRAR.
        "404":
          description: Usuario no encontrado.

  /api/v1/admin/usuarios/{id}/restablecer-contrasena:
    post:
      tags:
        - Admin — Usuarios
      summary: Restablecer contraseña
      description: |
        Reemplaza la contraseña del usuario y revoca sus sesiones activas.
        **Permiso requerido:** `USUARIOS_ADMINISTRAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
