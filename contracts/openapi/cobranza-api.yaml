      summary: Personas disponibles en una asignación mensual
      description: |
        Lista todas las personas activas de la asignación mensual indicada, indicando si ya
        están en una diaria activa (BORRADOR o PUBLICADA).
        **Permiso requerido:** `PERM_ASIGNACIONES_VER`.
