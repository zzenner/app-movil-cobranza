              examples:
                propiacuenta:
                  value:
                    status: 409
                    code: "OPERACION_NO_PERMITIDA_PROPIA_CUENTA"
                ultimoAdmin:
                  value:
                    status: 409
                    code: "ULTIMO_ADMINISTRADOR"

  /api/v1/admin/usuarios/{id}/bloquear:
    post:
      tags:
        - Admin — Usuarios
      summary: Bloquear usuario administrativamente
      description: |
        Bloquea al usuario (`bloqueado = true`) y revoca sus sesiones activas.
        No puede ejecutarse sobre la propia cuenta (409) ni si es el último administrador activo (409).
        **Permiso requerido:** `USUARIOS_ADMINISTRAR`.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Usuario bloqueado.
        "401":
          description: No autenticado.
        "403":
          description: Sin permiso USUARIOS_ADMINISTRAR.
        "404":
          description: Usuario no encontrado.
        "409":
          description: Operación no permitida.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /api/v1/admin/usuarios/{id}/desbloquear:
    post:
      tags:
        - Admin — Usuarios
      summary: Desbloquear usuario
      description: |
        Limpia el bloqueo administrativo y el bloqueo temporal (`bloqueado = false`, `bloqueadoHasta = null`,
        `intentosFallidos = 0`).
