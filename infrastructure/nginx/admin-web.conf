server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No registrar access token ni cookie en logs
    log_format safe '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log safe;

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Headers de seguridad básicos
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Proxy hacia la API — conserva todos los headers del navegador
    location ^~ /api {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CRÍTICO: pasar el Origin del navegador sin modificar
        # El WebOriginValidationFilter lo valida contra WEB_ALLOWED_ORIGIN
        proxy_set_header Origin $http_origin;

        # Permitir que la cookie rt_web fluya correctamente
        proxy_pass_header Set-Cookie;

        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # SPA Angular — fallback a index.html para rutas del router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Healthcheck interno de Nginx
    location /nginx-health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
